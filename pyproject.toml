readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.9.0",
    "httpx>=0.28.1",
    "imbalanced-learn>=0.14.2",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pytest>=9.2.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sentence-transformers>=6.3.0",
    "statsmodels>=0.15.0",
    "wandb>=0.31.0",
    "xgboost>=3.4.1",
]
